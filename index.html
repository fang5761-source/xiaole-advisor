<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e8"><link rel="manifest" href="./manifest.webmanifest?v=0.2.2"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=0.2.2"><link rel="icon" type="image/png" href="./favicon-64.png?v=0.2.2"><title>小樂</title><style>
:root{--bg:#f6f2e8;--card:#fffdf7;--green:#496b57;--soft:#e8efe7;--ink:#27332b;--muted:#788078;--line:#dedfd7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:720px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;margin:0}.status{font-size:13px;color:var(--green)}main{flex:1;padding:10px 16px 145px}.day{font-size:12px;color:var(--muted);text-align:center;margin:14px}.bubble{max-width:86%;padding:11px 13px;border-radius:18px;margin:8px 0;line-height:1.55;white-space:pre-wrap}.me{margin-left:auto;background:var(--green);color:white;border-bottom-right-radius:6px}.xiaole{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}.time{font-size:10px;opacity:.65;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:80px 28px;line-height:1.8}.composer{position:fixed;left:0;right:0;bottom:64px;padding:8px 12px;background:linear-gradient(transparent,var(--bg) 22%)}.composeInner{max-width:696px;margin:auto;background:white;border:1px solid var(--line);border-radius:22px;display:flex;align-items:flex-end;padding:7px 8px;box-shadow:0 5px 20px #00000010}.composeInner textarea{flex:1;border:0;outline:0;resize:none;font:inherit;max-height:120px;padding:8px;background:transparent}.round{border:0;background:var(--soft);color:var(--green);width:38px;height:38px;border-radius:50%;font-size:20px}.send{background:var(--green);color:white}.nav{position:fixed;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:#fffdf9;border-top:1px solid var(--line);display:flex;justify-content:center}.navIn{max-width:720px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:var(--muted);font-size:12px}.nav button.active{color:var(--green);font-weight:700}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.panel h2{font-size:17px;margin:0 0 8px}.small{font-size:13px;color:var(--muted);line-height:1.6}.action{width:100%;margin:6px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;text-align:left;color:var(--ink)}input.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font:inherit;background:white}.result{padding:12px 4px;border-bottom:1px solid var(--line)}
</style></head><body><div class="app"><header class="top"><h1>小樂</h1><div class="status" id="cloudStatus">● 本機</div></header><main id="main"></main></div><div class="composer" id="composer"><div class="composeInner"><button class="round" id="plus">＋</button><textarea id="input" rows="1" placeholder="想到什麼就說……"></textarea><button class="round send" id="send">➤</button></div></div><nav class="nav"><div class="navIn"><button data-tab="chat" class="active">💬<br>小樂</button><button data-tab="memory">📚<br>回憶</button><button data-tab="reminder">🔔<br>提醒</button><button data-tab="me">👤<br>我的</button></div></nav><script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCvtDHMW-Uz_OYDX80EMP4hFPnXQ1CqRms",authDomain:"xiaole-advisor.firebaseapp.com",projectId:"xiaole-advisor",storageBucket:"xiaole-advisor.firebasestorage.app",messagingSenderId:"320682542237",appId:"1:320682542237:web:22b16a4be2f27eb7620074"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), cloud=firebase.firestore();
const DB='xiaole-advisor-v01',STORE='messages';let db=null,dbPromise=null,tab='chat',user=null,syncing=false;
function openDB(){
  if(db) return Promise.resolve(db);
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((ok,no)=>{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};
    r.onsuccess=e=>{db=e.target.result;db.onclose=()=>{db=null;dbPromise=null};db.onversionchange=()=>{try{db.close()}catch(_){ }db=null;dbPromise=null};ok(db)};
    r.onerror=()=>{dbPromise=null;no(r.error)};
    r.onblocked=()=>{dbPromise=null;no(new Error('本機資料庫暫時被其他頁面占用，請關閉其他小樂分頁後再試。'))};
  });
  return dbPromise;
}
async function idbRequest(mode,action,retry=true){
  try{
    const d=await openDB();
    return await new Promise((ok,no)=>{
      let tr,store,req;
      try{tr=d.transaction(STORE,mode);store=tr.objectStore(STORE);req=action(store)}catch(e){no(e);return}
      req.onsuccess=()=>ok(req.result);
      req.onerror=()=>no(req.error);
      tr.onabort=()=>no(tr.error||new Error('本機資料庫交易中止'));
    });
  }catch(e){
    if(retry && (e?.name==='InvalidStateError' || /closing|closed/i.test(e?.message||''))){
      try{db?.close()}catch(_){ }
      db=null;dbPromise=null;
      return idbRequest(mode,action,false);
    }
    throw e;
  }
}
function allMessages(){return idbRequest('readonly',s=>s.getAll()).then(x=>x||[])}
function addMessage(m){return idbRequest('readwrite',s=>s.add(m))}
function putMessage(m){return idbRequest('readwrite',s=>s.put(m))}
function clearMessages(){return idbRequest('readwrite',s=>s.clear())}
const fmt=t=>new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit'}).format(new Date(t));
const day=t=>new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(t));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeCloudId=()=>crypto.randomUUID?crypto.randomUUID():'m-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function setStatus(s){cloudStatus.textContent=s}
async function renderChat(){let a=(await allMessages()).sort((a,b)=>a.createdAt-b.createdAt),m=document.querySelector('#main');if(!a.length){m.innerHTML='<div class="empty">這裡會是一條一直延續下去的對話。<br>先跟小樂說第一句話吧 😆</div>';return}let last='';m.innerHTML=a.map(x=>{let d=day(x.createdAt),h=(d!==last?`<div class="day">${last=d}</div>`:'');return h+`<div class="bubble ${x.role==='user'?'me':'xiaole'}">${esc(x.text)}<div class="time">${fmt(x.createdAt)}${x.synced?' · ☁️':''}</div></div>`}).join('');scrollTo(0,document.body.scrollHeight)}
async function renderMemory(){let a=(await allMessages()).sort((a,b)=>b.createdAt-a.createdAt);document.querySelector('#main').innerHTML=`<div class="panel"><h2>回憶搜尋</h2><div class="small">先搜尋本機已同步／保存的原始對話，不花 AI 費。</div></div><input class="search" id="q" placeholder="例如：秋刀魚、Apple Watch……"><div id="results"></div>`;q.oninput=()=>{let s=q.value.trim().toLowerCase();results.innerHTML=!s?'':a.filter(x=>String(x.text).toLowerCase().includes(s)).slice(0,50).map(x=>`<div class="result"><b>${x.role==='user'?'我':'小樂'}</b> · ${day(x.createdAt)} ${fmt(x.createdAt)}<br>${esc(x.text)}</div>`).join('')}}
function renderReminder(){document.querySelector('#main').innerHTML='<div class="panel"><h2>提醒</h2><div class="small">V0.2 先完成登入與同步。提醒功能下一階段加入。</div></div>'}
function renderMe(){const who=user?`<b>${esc(user.displayName||'已登入')}</b><br>${esc(user.email||'')}`:'尚未登入 Google 帳號';document.querySelector('#main').innerHTML=`<div class="panel"><h2>Google 帳號</h2><div class="small">${who}</div>${user?'<button class="action" id="syncBtn">☁️ 立即同步</button><button class="action" id="logoutBtn">登出 Google</button>':'<button class="action" id="loginBtn">G　使用 Google 帳號登入</button>'}</div><div class="panel"><h2>資料保險</h2><div class="small">本機資料仍保留；登入後另同步一份到 Firestore。匯出包可再留一份在自己手上。</div><button class="action" id="exportBtn">📦 匯出文字備份</button><button class="action" id="clearBtn">清除本機測試資料</button></div>`;
if(user){syncBtn.onclick=syncNow;logoutBtn.onclick=()=>auth.signOut()}else loginBtn.onclick=loginGoogle;exportBtn.onclick=exportData;clearBtn.onclick=async()=>{if(confirm('只清除這台裝置的本機資料？雲端資料不會刪除。')){await clearMessages();renderMe()}}}
async function loginGoogle(){try{const p=new firebase.auth.GoogleAuthProvider();await auth.signInWithPopup(p)}catch(e){alert('Google 登入沒有完成：'+e.message)}}
async function syncNow(){if(!user||syncing)return;syncing=true;setStatus('↻ 同步中');try{
 await openDB();
 let local=await allMessages();
 // 先為舊 V0.1 訊息補 cloudId，再上傳。setDoc 可重複執行而不產生重複資料。
 for(const m of local){if(!m.cloudId){m.cloudId=makeCloudId();await putMessage(m)};await cloud.collection('users').doc(user.uid).collection('messages').doc(m.cloudId).set({role:m.role||'user',text:m.text||'',createdAt:m.createdAt||Date.now()},{merge:true});if(!m.synced){m.synced=true;await putMessage(m)}}
 const snap=await cloud.collection('users').doc(user.uid).collection('messages').orderBy('createdAt','asc').get();
 local=await allMessages();const ids=new Set(local.map(x=>x.cloudId).filter(Boolean));
 for(const d of snap.docs){if(ids.has(d.id))continue;const x=d.data();await addMessage({cloudId:d.id,role:x.role||'user',text:x.text||'',createdAt:x.createdAt||Date.now(),synced:true})}
 setStatus('● 已同步');if(tab==='chat')await renderChat();if(tab==='me')renderMe();
 }catch(e){setStatus('● 本機');alert('同步沒有完成：'+e.message)}finally{syncing=false}}
async function exportData(){let data={version:'0.2.2',exportedAt:new Date().toISOString(),messages:await allMessages()};let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`小樂備份_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)}
async function sendMsg(){let v=input.value.trim();if(!v)return;const m={role:'user',text:v,createdAt:Date.now(),cloudId:makeCloudId(),synced:false};await addMessage(m);input.value='';await renderChat();if(user)syncNow()}
send.onclick=sendMsg;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}};plus.onclick=()=>alert('圖片／網址入口後續版本加入。');
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));composer.style.display=tab==='chat'?'block':'none';({chat:renderChat,memory:renderMemory,reminder:renderReminder,me:renderMe}[tab])()});
auth.onAuthStateChanged(async u=>{user=u||null;if(user){setStatus('↻ 同步中');await syncNow()}else setStatus('● 本機');if(tab==='me')renderMe()});
openDB().then(()=>renderChat()).catch(e=>{setStatus('● 本機');alert('本機資料庫開啟失敗：'+e.message)});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js?v=0.2.1').catch(()=>{});
</script></body></html>
