function openDB(){
  if(db) return Promise.resolve(db);
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((ok,no)=>{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};
    r.onsuccess=e=>{db=e.target.result;db.onclose=()=>{db=null;dbPromise=null};db.onversionchange=()=>{try{db.close()}catch(_){ }db=null;dbPromise=null};ok(db)};
    r.onerror=()=>{dbPromise=null;no(r.error)};
    r.onblocked=()=>{dbPromise=null;no(new Error('本機資料庫暫時被其他頁面占用，請關閉其他小樂分頁後再試。'))};
  });
  return dbPromise;
}
async function idbRequest(mode,action,retry=true){
  try{
    const d=await openDB();
    return await new Promise((ok,no)=>{
      let tr,store,req;
      try{tr=d.transaction(STORE,mode);store=tr.objectStore(STORE);req=action(store)}catch(e){no(e);return}
      req.onsuccess=()=>ok(req.result);
      req.onerror=()=>no(req.error);
      tr.onabort=()=>no(tr.error||new Error('本機資料庫交易中止'));
    });
  }catch(e){
    if(retry && (e?.name==='InvalidStateError' || /closing|closed/i.test(e?.message||''))){
      try{db?.close()}catch(_){ }
      db=null;dbPromise=null;
      return idbRequest(mode,action,false);
    }
    throw e;
  }
}

function urlBase64ToUint8Array(s){
  const p='='.repeat((4-s.length%4)%4), b=(s+p).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

function recallSearchText(card){
  if(card?.targetType==="memory"){
    return [card.content,card.category,card.evidenceSummary,card.originalTimeExpression].filter(Boolean).join(" ");
  }
  return [card.title,card.progress,card.evidenceSummary,card.originalTimeExpression].filter(Boolean).join(" ");
}

function chineseBigrams(text){
  const s=String(text||"").toLowerCase().replace(/\s+/g,"");
  const out=new Set();
  for(let i=0;i<s.length-1;i++){
    const pair=s.slice(i,i+2);
    if(/[\u3400-\u9fff]/.test(pair)) out.add(pair);
  }
  return out;
}

function sensitiveLikelyRelevant(message,card){
  const a=chineseBigrams(message);
  const b=chineseBigrams(recallSearchText(card));
  for(const x of a) if(b.has(x)) return true;

  const words=String(message||"").toLowerCase().match(/[a-z0-9]{3,}/g)||[];
  const hay=recallSearchText(card).toLowerCase();
  return words.some(w=>hay.includes(w));
}

function isStoredTimestamp(value){
  if(Number.isFinite(value)) return true;
  if(value && typeof value.toMillis==="function"){
    try{return Number.isFinite(value.toMillis())}catch(_){return false}
  }
  return !!(value && Number.isFinite(value.seconds) && Number.isFinite(value.nanoseconds));
}

  if(!data || typeof data!=="object") return false;

  // 舊的 CRUD 測試卡永遠不得進 Recall；正式 V1 卡不依 testOnly 欄位存在與否判定。
  if(data.testOnly===true) return false;

  const sensitivityOk=["normal","sensitive"].includes(String(data.sensitivity||""));
  const evidenceTypeOk=["explicit","derived"].includes(String(data.evidenceType||""));
  let sourceIds=data.sourceMessageIds;
  if(typeof sourceIds==="string"){
    try{sourceIds=JSON.parse(sourceIds)}catch(_){sourceIds=[]}
  }
  const sourceIdsOk=Array.isArray(sourceIds) && sourceIds.length>0 &&
    sourceIds.every(x=>typeof x==="string" && x.trim());
  const evidenceSummaryOk=typeof data.evidenceSummary==="string" && data.evidenceSummary.trim().length>0;
  const createdAtOk=isStoredTimestamp(data.createdAt);
  const updatedAtOk=isStoredTimestamp(data.updatedAt);

  if(!sensitivityOk || !evidenceTypeOk || !sourceIdsOk || !evidenceSummaryOk || !createdAtOk || !updatedAtOk) return false;

  if(targetType==="memory"){
    return typeof data.content==="string" && data.content.trim().length>0 &&
      ["關於姐姐","重要的人","偏好與習慣","互動規則"].includes(String(data.category||"")) &&
      ["stable","contextual"].includes(String(data.memoryType||"")) &&
      ["active","retired"].includes(String(data.status||""));
  }

  if(targetType==="item"){
    return typeof data.title==="string" && data.title.trim().length>0 &&
      ["ongoing","paused","completed","abandoned"].includes(String(data.state||""));
  }
  return false;
}

function compactRecallCard(id,targetType,data){
  if(targetType==="memory"){
    return {
      id,targetType:"memory",
      content:String(data.content||""),
      category:String(data.category||""),
      memoryType:String(data.memoryType||""),
      status:String(data.status||"active"),
      sensitivity:String(data.sensitivity||"normal"),
      evidenceSummary:String(data.evidenceSummary||""),
      eventTimeValue:data.eventTimeValue??null,
      timeGranularity:data.timeGranularity??null,
      timeCertainty:data.timeCertainty??null,
      originalTimeExpression:data.originalTimeExpression??null
    };
  }
  return {
    id,targetType:"item",
    title:String(data.title||""),
    state:String(data.state||"ongoing"),
    progress:data.progress??null,
    sensitivity:String(data.sensitivity||"normal"),
    evidenceSummary:String(data.evidenceSummary||""),
    eventTimeValue:data.eventTimeValue??null,
    timeGranularity:data.timeGranularity??null,
    timeCertainty:data.timeCertainty??null,
    originalTimeExpression:data.originalTimeExpression??null
  };
}

async function loadRecallPoolReadOnly(currentUserMessage){
  if(!user) return [];

  const token=await user.getIdToken();
  const res=await fetch(BUTLER_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
    body:JSON.stringify({mode:'memory-read-test'})
  });
  const data=await res.json();
  if(!res.ok || !data?.ok) throw new Error(data?.error || `Recall pool HTTP ${res.status}`);

  const memoryDocs=Array.isArray(data.memories)?data.memories:[];
  const itemDocs=Array.isArray(data.items)?data.items:[];
  const cards=[];

  for(const row of memoryDocs){
    if(!isRecallEligibleV1Card("memory",row)) continue;
    const card=compactRecallCard(row.id,"memory",row);
    if(card.sensitivity!=="sensitive" || sensitiveLikelyRelevant(currentUserMessage,card)) cards.push(card);
  }

  for(const row of itemDocs){
    if(!isRecallEligibleV1Card("item",row)) continue;
    const card=compactRecallCard(row.id,"item",row);
    if(card.sensitivity!=="sensitive" || sensitiveLikelyRelevant(currentUserMessage,card)) cards.push(card);
  }
  return cards;
}

async function runRecallReadOnly(currentUserMessage,idToken){
  const cards=await loadRecallPoolReadOnly(currentUserMessage);
  if(!cards.length){
    return {query:currentUserMessage,poolCount:0,selectedCards:[],recall:{shouldRecall:false,selectedKeys:[],reason:"目前沒有可供 Recall 判斷的卡片。"}};
  }

  const r=await fetch(BUTLER_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+idToken
    },
    body:JSON.stringify({
      mode:"recall",
      currentUserMessage,
      cards:cards.map((card,index)=>{
        const {id,...safeCard}=card;
        return {selectionKey:"C"+(index+1),...safeCard};
      })
    })
  });
  const data=await r.json();
  if(!r.ok || !data.ok) throw new Error(data?.error || ("Recall HTTP "+r.status));

  const selectedKeys=Array.isArray(data?.recall?.selectedKeys)?data.recall.selectedKeys:[];
  const byKey=new Map(cards.map((card,index)=>["C"+(index+1),card]));
  const selectedCards=selectedKeys.map(key=>byKey.get(key)).filter(Boolean);

  return {
    query:currentUserMessage,
    poolCount:cards.length,
    selectedCards,
    recall:data.recall
  };
}

// V1 入住接線候選：正式聊天產生的 Candidate 改送 V7.17 D1 Live Router。
// 目前正式環境 Write Power 維持 OFF；HTTP 423 + FORMAL_WRITE_POWER_OFF_NO_D1_MUTATION
// 視為「已抵達正確 Executor、被總電源安全擋住」的預期驗收結果，不當成聊天失敗。
async function routeCandidatesToFormalD1PowerOff(message,candidates,messageId,idToken){
  const results=[];
  for(let i=0;i<(candidates||[]).length;i++){
    const candidate=candidates[i];
    try{
      const res=await fetch(BUTLER_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${idToken}`},
        body:JSON.stringify({
          mode:'formal-orchestration-live-router-v1',
          candidate,
          candidateIndex:i,
          message,
          messageId
        })
      });
      let data=null;
      try{ data=await res.json(); }catch(_){ data=null; }

      const safelyBlockedByPowerOff=
        res.status===423 &&
        data?.databaseWrite===false &&
        data?.powerEnabled===false &&
        data?.safety==='FORMAL_WRITE_POWER_OFF_NO_D1_MUTATION';

      const safeNoMutation=
        res.ok &&
        data?.databaseWrite===false &&
        data?.liveRoute===null &&
        ['LIVE_ROUTER_NO_MUTATION_ACTION','LIVE_ROUTER_NO_MUTATING_ACTION'].includes(data?.safety);

      if(safelyBlockedByPowerOff){
        results.push({candidateIndex:i,candidateType:candidate?.targetType||'',status:'POWER_OFF_BLOCKED_AS_EXPECTED',httpStatus:res.status,mode:data?.mode||null,databaseWrite:false,safety:data?.safety||null});
      }else if(safeNoMutation){
        results.push({candidateIndex:i,candidateType:candidate?.targetType||'',status:'NO_MUTATION_AS_EXPECTED',httpStatus:res.status,mode:data?.mode||null,databaseWrite:false,safety:data?.safety||null});
      }else if(res.ok && data?.ok){
        // Write Power 理論上目前是 OFF；若意外真的寫入，立即把異常留下來供驗收，不能靜默當成功。
        results.push({candidateIndex:i,candidateType:candidate?.targetType||'',status:data?.databaseWrite===true?'UNEXPECTED_DATABASE_WRITE':'ROUTER_OK',httpStatus:res.status,mode:data?.mode||null,databaseWrite:data?.databaseWrite===true,safety:data?.safety||null});
      }else{
        results.push({candidateIndex:i,candidateType:candidate?.targetType||'',status:'ROUTER_ERROR',httpStatus:res.status,error:data?.error||`HTTP ${res.status}`,databaseWrite:data?.databaseWrite===true,safety:data?.safety||null});
      }
    }catch(e){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||'',status:'ROUTER_ERROR',error:String(e?.message||e),databaseWrite:false});
    }
  }
  return {messageId,results};
}

async function sendMsg(){
  let v=input.value.trim();
  if(!v)return;

  const userMessage={role:'user',text:v,createdAt:Date.now(),cloudId:makeCloudId(),synced:false};
  await addMessage(userMessage);
  input.value='';
  send.disabled=true;
  input.disabled=true;
  await renderChat();
  showThinking();
  if(user)syncNow();

  try{
    // 只帶最近 8 則對話（包含剛送出的這一句），讓小樂接得住眼前上下文。
    const recent=(await allMessages())
      .filter(x=>x.role==='user'||x.role==='assistant')
      .sort((a,b)=>a.createdAt-b.createdAt)
      .slice(-8)
      .map(x=>({role:x.role,text:String(x.text||'')}));

    // V0.6.2：Firebase ID token 作為敲管家門的短效門禁卡。
    if(!user) throw new Error('請先登入 Google 帳號，才能和小樂聊天。');
    const idToken=await user.getIdToken();

    // V0.7 Recall → Answer：先唯讀找出真正相關的既有卡片，再把「選中的卡片」交給正常回答。
    // Recall 本身仍不寫入 Memory / Item。
    let recallResult;
    try{
      recallResult=await runRecallReadOnly(v,idToken);
      lastRecallObservation={messageId:userMessage.cloudId,...recallResult};
    }catch(recallError){
      recallResult={
        poolCount:0,
        selectedCards:[],
        recall:{shouldRecall:false,selectedKeys:[],reason:"❌ Recall 發生錯誤："+String(recallError?.message||recallError)}
      };
      lastRecallObservation={messageId:userMessage.cloudId,...recallResult};
    }
    const recalledCards=Array.isArray(recallResult?.selectedCards)?recallResult.selectedCards:[];

    const r=await fetch(BUTLER_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+idToken
      },
      body:JSON.stringify({message:v,messageId:userMessage.cloudId,messageCreatedAt:userMessage.createdAt,messageTimezoneOffsetMinutes:new Date(userMessage.createdAt).getTimezoneOffset(),recent,recalledCards})
    });
    const data=await r.json();
    if(!r.ok || !data.ok) throw new Error(data?.error || ('HTTP '+r.status));

    // V0.7 messageId 完整性檢查：Worker 回傳的編號必須與這則原始訊息的 cloudId 完全一致。
    if(data.receivedMessageId !== userMessage.cloudId){
      throw new Error('messageId 核對失敗：Worker 收到的編號與原始訊息 cloudId 不一致。');
    }
    if(data.receivedMessageCreatedAt !== userMessage.createdAt){
      throw new Error('messageCreatedAt 核對失敗：Worker 收到的時間與原始訊息 createdAt 不一致。');
    }
    const expectedTimezoneOffsetMinutes=new Date(userMessage.createdAt).getTimezoneOffset();
    if(data.receivedMessageTimezoneOffsetMinutes !== expectedTimezoneOffsetMinutes){
      throw new Error('messageTimezoneOffsetMinutes 核對失敗：Worker 收到的時區偏移與原始訊息不一致。');
    }

    lastCandidateObservation={
      messageId:userMessage.cloudId,
      candidates:Array.isArray(data.candidates)?data.candidates:[]
    };
    // V1 入住接線候選：舊 Firestore Memory/Item Writer 不再由正式聊天呼叫。
    // Candidate 直接交給 V7.17 後端 Orchestration；Write Power 目前維持 OFF。
    await routeCandidatesToFormalD1PowerOff(
      v,
      lastCandidateObservation.candidates,
      userMessage.cloudId,
      idToken
    );

    const reply=String(data.reply||'').trim();
    if(!reply) throw new Error('小樂有收到訊息，但沒有取得回答文字。');

    const aiMessage={role:'assistant',text:reply,createdAt:Date.now(),cloudId:makeCloudId(),synced:false};
    await addMessage(aiMessage);
    removeThinking();
    await renderChat();
    if(user)syncNow();
  }catch(e){
    removeThinking();
    const errorMessage={role:'assistant',text:'目前沒有順利收到小樂的回答。\n'+e.message,createdAt:Date.now(),cloudId:makeCloudId(),synced:false};
    await addMessage(errorMessage);
    await renderChat();
  }finally{
    send.disabled=false;
    input.disabled=false;
    input.focus();
  }
}
