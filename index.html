function openDB(){
  if(db) return Promise.resolve(db);
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((ok,no)=>{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};
    r.onsuccess=e=>{db=e.target.result;db.onclose=()=>{db=null;dbPromise=null};db.onversionchange=()=>{try{db.close()}catch(_){ }db=null;dbPromise=null};ok(db)};
    r.onerror=()=>{dbPromise=null;no(r.error)};
    r.onblocked=()=>{dbPromise=null;no(new Error('本機資料庫暫時被其他頁面占用，請關閉其他小樂分頁後再試。'))};
  });
  return dbPromise;
}
async function idbRequest(mode,action,retry=true){
  try{
    const d=await openDB();
    return await new Promise((ok,no)=>{
      let tr,store,req;
      try{tr=d.transaction(STORE,mode);store=tr.objectStore(STORE);req=action(store)}catch(e){no(e);return}
      req.onsuccess=()=>ok(req.result);
      req.onerror=()=>no(req.error);
      tr.onabort=()=>no(tr.error||new Error('本機資料庫交易中止'));
    });
  }catch(e){
    if(retry && (e?.name==='InvalidStateError' || /closing|closed/i.test(e?.message||''))){
      try{db?.close()}catch(_){ }
      db=null;dbPromise=null;
      return idbRequest(mode,action,false);
    }
    throw e;
  }
}

async function loadRelatedCardsReadOnly(candidates){
  const result=[];
  if(!user || !Array.isArray(candidates) || candidates.length===0) return result;

  // relatedCards 階段只讀 Firestore，不寫 Memory / Item。
  // 為避免現在就建立複合索引，先讀取個人小型集合，再由前端做確定性篩選。
  let memoryDocs=[];
  let itemDocs=[];

  try{
    const ms=await cloud.collection('users').doc(user.uid).collection('memories').get();
    memoryDocs=ms.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    memoryDocs=[];
  }

  try{
    const is=await cloud.collection('users').doc(user.uid).collection('items').get();
    itemDocs=is.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    itemDocs=[];
  }

  for(let i=0;i<candidates.length;i++){
    const c=candidates[i];
    let cards=[];

    if(c?.targetType==='memory'){
      cards=memoryDocs
        .filter(x=>x.status==='active' && x.category===c.category)
        .map(x=>({
          targetType:'memory',
          id:x.id,
          content:String(x.content||''),
          category:String(x.category||''),
          memoryType:String(x.memoryType||''),
          status:String(x.status||''),
          sensitivity:String(x.sensitivity||''),
          evidenceType:String(x.evidenceType||'')
        }));
    }else if(c?.targetType==='item'){
      cards=itemDocs
        .filter(x=>x.state==='ongoing' || x.state==='paused')
        .map(x=>({
          targetType:'item',
          id:x.id,
          title:String(x.title||''),
          state:String(x.state||''),
          progress:x.progress==null?null:String(x.progress),
          sensitivity:String(x.sensitivity||''),
          evidenceType:String(x.evidenceType||'')
        }));
    }

    result.push({candidateIndex:i,candidateType:c?.targetType||'',cards});
  }
  return result;
}


async function runJudgeReadOnly(candidate, relatedCards){
  if(!user) throw new Error('尚未登入，無法執行 Judge。');
  const token=await user.getIdToken();
  const res=await fetch(BUTLER_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
    body:JSON.stringify({mode:'judge',candidate,relatedCards})
  });
  const data=await res.json();
  if(!res.ok || !data?.ok) throw new Error(data?.error || 'Judge 唯讀判斷失敗。');
  return data.judge;
}

async function buildJudgeObservation(messageId,candidates,groups){
  const decisions=[];
  for(let i=0;i<(candidates||[]).length;i++){
    const group=(groups||[]).find(g=>g.candidateIndex===i);
    const relatedCards=group?.cards || [];
    try{
      const judge=await runJudgeReadOnly(candidates[i],relatedCards);
      decisions.push({candidateIndex:i,candidateType:candidates[i]?.targetType||'',judge});
    }catch(e){
      decisions.push({candidateIndex:i,candidateType:candidates[i]?.targetType||'',error:String(e?.message||e)});
    }
  }
  return {messageId,decisions};
}


function containsBlockedSecret(candidate){
  const text=JSON.stringify(candidate||{});
  const patterns=[
    /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/i,
    /\b(?:sk|pk)-[A-Za-z0-9_-]{20,}\b/,
    /\bAIza[0-9A-Za-z_-]{20,}\b/,
    /\b(?:api[_ -]?key|password|passwd|密碼|驗證碼|一次性密碼|otp)\s*[:：=]\s*\S{4,}/i,
    /\b(?:\d[ -]*?){13,19}\b/
  ];
  return patterns.some(p=>p.test(text));
}

function validateDecisionReadOnly(messageId,candidate,relatedCards,judge){
  const reasons=[];
  const allowedIds=new Set((relatedCards||[]).map(x=>x?.id).filter(Boolean));
  const action=judge?.action;
  const targetId=judge?.targetId ?? null;
  const replacement=judge?.replacement ?? null;
  const target=(relatedCards||[]).find(x=>x?.id===targetId) || null;

  if(!["CREATE","UPDATE","RETIRE","HOLD","NO_ACTION"].includes(action))
    reasons.push("未知的 action。");

  if(containsBlockedSecret(candidate))
    reasons.push("Candidate 疑似含密碼、驗證碼、API key、私鑰或完整卡號等秘密資料。");

  if(candidate?.sensitivity==="sensitive" && candidate?.evidenceType==="derived" && action==="CREATE")
    reasons.push("derived 的敏感資訊不可自動 CREATE。");

  if(targetId!==null && !allowedIds.has(targetId))
    reasons.push("targetId 不在本次 relatedCards 允許清單中。");

  if(action==="CREATE" && targetId!==null)
    reasons.push("CREATE 不可指定 targetId。");

  if(["UPDATE","RETIRE"].includes(action) && targetId===null)
    reasons.push(`${action} 必須指定既有 targetId。`);

  if(action==="RETIRE" && candidate?.targetType==="item")
    reasons.push("Item 不使用 RETIRE；生命週期只能用 UPDATE 改 state。");

  if(action==="UPDATE" && target && target.targetType!==candidate?.targetType)
    reasons.push("UPDATE 的 targetType 與 Candidate 不一致。");

  if(action==="RETIRE" && target && target.targetType!=="memory")
    reasons.push("RETIRE 的 target 必須是 Memory。");

  if(action==="UPDATE" && candidate?.targetType==="item"){
    const nextState=replacement?.state ?? candidate?.state ?? null;
    if(["completed","abandoned"].includes(nextState) && candidate?.evidenceType!=="explicit")
      reasons.push("Item 進入 completed / abandoned 必須有 explicit 證據。");
  }

  if(action==="RETIRE"){
    const rr=replacement?.retireReason ?? null;
    if(!["superseded","resolved"].includes(rr))
      reasons.push("RETIRE 必須明確指定 retireReason=superseded 或 resolved。");

    if(rr==="resolved"){
      if(target?.memoryType!=="contextual")
        reasons.push("resolved 只適用於 contextual Memory。");
      if(candidate?.evidenceType!=="explicit")
        reasons.push("resolved 必須有 explicit 證據。");
    }

    if(rr==="superseded"){
      if(!replacement || !String(replacement?.content||"").trim())
        reasons.push("superseded 必須帶有新的 Memory replacement content。");
    }
  }

  if(action==="UPDATE" && !replacement)
    reasons.push("UPDATE 必須提供 replacement。");

  const pass=reasons.length===0;
  const writeEligible=pass && ["CREATE","UPDATE","RETIRE"].includes(action);

  return {
    status:pass?"PASS":"BLOCK",
    writeEligible,
    action:action||null,
    targetId,
    sourceMessageIds:[messageId],
    reasons:pass
      ? [writeEligible
          ? "通過硬規則；若 action=CREATE，下一層才有資格執行正式寫入。"
          : "裁決本身合法，但 HOLD / NO_ACTION 本來就不應寫入 Firestore。"]
      : reasons
  };
}

function buildValidationObservation(messageId,candidates,groups,judgeObservation){
  const results=[];
  for(let i=0;i<(candidates||[]).length;i++){
    const group=(groups||[]).find(g=>g.candidateIndex===i);
    const decision=(judgeObservation?.decisions||[]).find(d=>d.candidateIndex===i);
    if(!decision || decision.error || !decision.judge){
      results.push({
        candidateIndex:i,
        candidateType:candidates[i]?.targetType||"",
        validation:{
          status:"BLOCK",
          writeEligible:false,
          action:null,
          targetId:null,
          sourceMessageIds:[messageId],
          reasons:[decision?.error || "沒有可驗證的 Judge 裁決。"]
        }
      });
      continue;
    }
    results.push({
      candidateIndex:i,
      candidateType:candidates[i]?.targetType||"",
      validation:validateDecisionReadOnly(
        messageId,
        candidates[i],
        group?.cards||[],
        decision.judge
      )
    });
  }
  return {messageId,results};
}



function cleanOptionalTimeFields(source,out){
  if(source?.eventTimeValue!=null) out.eventTimeValue=String(source.eventTimeValue);
  if(source?.timeGranularity!=null) out.timeGranularity=String(source.timeGranularity);
  if(source?.timeCertainty!=null) out.timeCertainty=String(source.timeCertainty);
  if(source?.originalTimeExpression!=null) out.originalTimeExpression=String(source.originalTimeExpression);
  return out;
}

function buildCreateDocument(messageId,candidate,judge){
  const replacement=judge?.replacement || {};
  if(candidate?.targetType==="memory"){
    const out={
      content:String(replacement.content ?? candidate.content ?? "").trim(),
      category:String(candidate.category||""),
      memoryType:String(candidate.memoryType||""),
      status:"active",
      sensitivity:String(candidate.sensitivity||"normal"),
      evidenceType:String(candidate.evidenceType||"explicit"),
      sourceMessageIds:[messageId],
      evidenceSummary:String(candidate.evidenceSummary||""),
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    return cleanOptionalTimeFields(candidate,out);
  }
  if(candidate?.targetType==="item"){
    const out={
      title:String(replacement.title ?? candidate.title ?? "").trim(),
      state:String(replacement.state ?? candidate.state ?? "ongoing"),
      sensitivity:String(candidate.sensitivity||"normal"),
      evidenceType:String(candidate.evidenceType||"explicit"),
      sourceMessageIds:[messageId],
      evidenceSummary:String(candidate.evidenceSummary||""),
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    const progress=replacement.progress ?? candidate.progress ?? null;
    if(progress!=null) out.progress=String(progress);
    return cleanOptionalTimeFields(candidate,out);
  }
  throw new Error("未知的 Candidate 類型。");
}

function verifyCreatedDocument(messageId,candidate,data){
  if(!data) throw new Error("寫入後讀回不到文件。");
  if(!Array.isArray(data.sourceMessageIds) || data.sourceMessageIds.length!==1 || data.sourceMessageIds[0]!==messageId)
    throw new Error("sourceMessageIds 讀回核對失敗。");
  if(candidate?.targetType==="memory"){
    if(data.status!=="active") throw new Error("Memory status 讀回核對失敗。");
    if(data.category!==candidate.category) throw new Error("Memory category 讀回核對失敗。");
    if(data.memoryType!==candidate.memoryType) throw new Error("Memory memoryType 讀回核對失敗。");
    if(data.sensitivity!==candidate.sensitivity) throw new Error("Memory sensitivity 讀回核對失敗。");
    if(data.evidenceType!==candidate.evidenceType) throw new Error("Memory evidenceType 讀回核對失敗。");
  }else if(candidate?.targetType==="item"){
    if(data.sensitivity!==candidate.sensitivity) throw new Error("Item sensitivity 讀回核對失敗。");
    if(data.evidenceType!==candidate.evidenceType) throw new Error("Item evidenceType 讀回核對失敗。");
  }
  if(!data.createdAt || !data.updatedAt) throw new Error("createdAt / updatedAt 尚未正確落地。");
}

async function executeCreateWrites(messageId,candidates,judgeObservation,validationObservation){
  const results=[];
  if(!user) return {messageId,results:[{status:"SKIP",reason:"尚未登入，未執行寫入。"}]};
  for(let i=0;i<(candidates||[]).length;i++){
    const candidate=candidates[i];
    const decision=(judgeObservation?.decisions||[]).find(d=>d.candidateIndex===i);
    const validation=(validationObservation?.results||[]).find(d=>d.candidateIndex===i)?.validation;
    const judge=decision?.judge;

    // 第一階段只放行 CREATE。UPDATE / RETIRE 仍鎖住。
    if(!validation || validation.status!=="PASS" || validation.writeEligible!==true || judge?.action!=="CREATE"){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"SKIP",reason:"不是通過 Validation 的 CREATE；沒有寫入。"});
      continue;
    }

    const prefix=candidate?.targetType==="memory"?"m":"i";
    const docId=`${prefix}_${messageId}_${i}`;
    const collection=candidate?.targetType==="memory"?"memories":"items";
    const ref=cloud.collection("users").doc(user.uid).collection(collection).doc(docId);

    try{
      const before=await ref.get();
      if(before.exists){
        verifyCreatedDocument(messageId,candidate,before.data());
        results.push({candidateIndex:i,candidateType:candidate.targetType,status:"VERIFIED_EXISTING",documentId:docId,reason:"同一訊息的 CREATE 已存在；未重複建立，讀回核對通過。"});
        continue;
      }

      const payload=buildCreateDocument(messageId,candidate,judge);
      if(candidate.targetType==="memory" && !payload.content) throw new Error("Memory content 為空，停止寫入。");
      if(candidate.targetType==="item" && !payload.title) throw new Error("Item title 為空，停止寫入。");

      await ref.set(payload);
      const after=await ref.get();
      if(!after.exists) throw new Error("寫入後文件不存在。");
      verifyCreatedDocument(messageId,candidate,after.data());
      results.push({candidateIndex:i,candidateType:candidate.targetType,status:"CREATED_AND_VERIFIED",documentId:docId,reason:"CREATE 已正式寫入 Firestore，並完成讀回核對。"});
    }catch(e){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"ERROR",documentId:docId,reason:String(e?.message||e)});
    }
  }
  return {messageId,results};
}



function mergeSourceMessageIds(existing,messageId){
  const old=Array.isArray(existing)?existing.filter(x=>typeof x==="string"&&x):[];
  return [...new Set([...old,messageId])];
}

function buildUpdatePatch(messageId,candidate,judge,before){
  const replacement=judge?.replacement || {};
  if(candidate?.targetType==="memory"){
    const content=String(replacement.content ?? candidate.content ?? "").trim();
    if(!content) throw new Error("Memory UPDATE content 為空，停止寫入。");
    const patch={
      content,
      sourceMessageIds:mergeSourceMessageIds(before?.sourceMessageIds,messageId),
      evidenceSummary:String(candidate.evidenceSummary||before?.evidenceSummary||""),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    return cleanOptionalTimeFields(candidate,patch);
  }
  if(candidate?.targetType==="item"){
    const title=String(replacement.title ?? candidate.title ?? before?.title ?? "").trim();
    const state=String(replacement.state ?? candidate.state ?? before?.state ?? "").trim();
    if(!title || !state) throw new Error("Item UPDATE title / state 不完整，停止寫入。");
    const patch={
      title,
      state,
      sourceMessageIds:mergeSourceMessageIds(before?.sourceMessageIds,messageId),
      evidenceSummary:String(candidate.evidenceSummary||before?.evidenceSummary||""),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    const progress=replacement.progress ?? candidate.progress;
    if(progress!==undefined && progress!==null) patch.progress=String(progress);
    return cleanOptionalTimeFields(candidate,patch);
  }
  throw new Error("未知的 Candidate 類型。");
}

function verifyUpdatedDocument(messageId,candidate,judge,before,after){
  if(!after) throw new Error("UPDATE 後讀回不到文件。");
  if(!Array.isArray(after.sourceMessageIds) || !after.sourceMessageIds.includes(messageId))
    throw new Error("UPDATE 後 sourceMessageIds 沒有包含本則 messageId。");
  if(!after.updatedAt) throw new Error("UPDATE 後 updatedAt 尚未正確落地。");

  // UPDATE 不可把原文件建立時間改掉。
  if(before?.createdAt && after?.createdAt && typeof before.createdAt.isEqual==="function" && !before.createdAt.isEqual(after.createdAt))
    throw new Error("UPDATE 不應改動 createdAt。");

  const replacement=judge?.replacement || {};
  if(candidate?.targetType==="memory"){
    const expected=String(replacement.content ?? candidate.content ?? "").trim();
    if(after.content!==expected) throw new Error("Memory content UPDATE 讀回核對失敗。");
    if(after.status!=="active") throw new Error("Memory UPDATE 不應改變 active 狀態。");
  }else if(candidate?.targetType==="item"){
    const expectedTitle=String(replacement.title ?? candidate.title ?? before?.title ?? "").trim();
    const expectedState=String(replacement.state ?? candidate.state ?? before?.state ?? "").trim();
    if(after.title!==expectedTitle) throw new Error("Item title UPDATE 讀回核對失敗。");
    if(after.state!==expectedState) throw new Error("Item state UPDATE 讀回核對失敗。");
    const expectedProgress=replacement.progress ?? candidate.progress;
    if(expectedProgress!==undefined && expectedProgress!==null && after.progress!==String(expectedProgress))
      throw new Error("Item progress UPDATE 讀回核對失敗。");
  }
}

async function executeUpdateWrites(messageId,candidates,relatedObservation,judgeObservation,validationObservation){
  const results=[];
  if(!user) return {messageId,results:[{status:"SKIP",reason:"尚未登入，未執行 UPDATE。"}]};

  for(let i=0;i<(candidates||[]).length;i++){
    const candidate=candidates[i];
    const group=(relatedObservation?.groups||[]).find(g=>g.candidateIndex===i);
    const decision=(judgeObservation?.decisions||[]).find(d=>d.candidateIndex===i);
    const validation=(validationObservation?.results||[]).find(d=>d.candidateIndex===i)?.validation;
    const judge=decision?.judge;

    if(!validation || validation.status!=="PASS" || validation.writeEligible!==true || judge?.action!=="UPDATE"){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"SKIP",reason:"不是通過 Validation 的 UPDATE；沒有更新。"});
      continue;
    }

    const targetId=judge?.targetId;
    const allowed=(group?.cards||[]).find(x=>x?.id===targetId);
    if(!targetId || !allowed){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"BLOCKED",targetId:targetId||null,reason:"targetId 不在本次 relatedCards 允許清單，停止 UPDATE。"});
      continue;
    }

    const collection=candidate?.targetType==="memory"?"memories":"items";
    const ref=cloud.collection("users").doc(user.uid).collection(collection).doc(targetId);

    try{
      const beforeSnap=await ref.get();
      if(!beforeSnap.exists) throw new Error("targetId 指向的既有文件不存在。");
      const before=beforeSnap.data();

      if(candidate?.targetType==="memory"){
        if(before.status!=="active") throw new Error("Memory target 不是 active，停止 UPDATE。");
        if(before.category!==candidate.category) throw new Error("Memory category 與 Candidate 不一致，停止 UPDATE。");
      }else if(candidate?.targetType==="item"){
        if(!["ongoing","paused"].includes(before.state)) throw new Error("Item target 不是 ongoing / paused，停止 UPDATE。");
      }

      const patch=buildUpdatePatch(messageId,candidate,judge,before);
      await ref.update(patch);

      const afterSnap=await ref.get();
      if(!afterSnap.exists) throw new Error("UPDATE 後文件不存在。");
      verifyUpdatedDocument(messageId,candidate,judge,before,afterSnap.data());

      results.push({candidateIndex:i,candidateType:candidate.targetType,status:"UPDATED_AND_VERIFIED",targetId,reason:"UPDATE 已更新 Judge 指定的既有文件，並完成寫後讀回核對。"});
    }catch(e){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"ERROR",targetId:targetId||null,reason:String(e?.message||e)});
    }
  }
  return {messageId,results};
}


function verifyRetiredMemory(messageId,before,after,retireReason,supersededBy){
  if(!after) throw new Error("RETIRE 後讀回不到原 Memory。");
  if(after.status!=="retired") throw new Error("RETIRE 後 status 不是 retired。");
  if(after.retireReason!==retireReason) throw new Error("RETIRE 後 retireReason 核對失敗。");
  if(!Array.isArray(after.sourceMessageIds) || !after.sourceMessageIds.includes(messageId))
    throw new Error("RETIRE 後 sourceMessageIds 沒有包含本則 messageId。");
  if(!after.updatedAt) throw new Error("RETIRE 後 updatedAt 尚未正確落地。");
  if(before?.createdAt && after?.createdAt && typeof before.createdAt.isEqual==="function" && !before.createdAt.isEqual(after.createdAt))
    throw new Error("RETIRE 不應改動原 Memory 的 createdAt。");

  if(retireReason==="superseded"){
    if(!supersededBy || after.supersededBy!==supersededBy)
      throw new Error("supersededBy 核對失敗。");
  }
}

async function executeRetireWrites(messageId,candidates,relatedObservation,judgeObservation,validationObservation){
  const results=[];
  if(!user) return {messageId,results:[{status:"SKIP",reason:"尚未登入，未執行 RETIRE。"}]};

  for(let i=0;i<(candidates||[]).length;i++){
    const candidate=candidates[i];
    const group=(relatedObservation?.groups||[]).find(g=>g.candidateIndex===i);
    const decision=(judgeObservation?.decisions||[]).find(d=>d.candidateIndex===i);
    const validation=(validationObservation?.results||[]).find(d=>d.candidateIndex===i)?.validation;
    const judge=decision?.judge;

    if(!validation || validation.status!=="PASS" || validation.writeEligible!==true || judge?.action!=="RETIRE"){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"SKIP",reason:"不是通過 Validation 的 RETIRE；沒有退休任何 Memory。"});
      continue;
    }

    if(candidate?.targetType!=="memory"){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"BLOCKED",reason:"只有 Memory 可以 RETIRE；Item 不使用 RETIRE。"});
      continue;
    }

    const targetId=judge?.targetId;
    const allowed=(group?.cards||[]).find(x=>x?.id===targetId && x?.targetType==="memory");
    if(!targetId || !allowed){
      results.push({candidateIndex:i,candidateType:"memory",status:"BLOCKED",targetId:targetId||null,reason:"targetId 不在本次 relatedCards 的 Memory 允許清單，停止 RETIRE。"});
      continue;
    }

    const replacement=judge?.replacement || {};
    const retireReason=replacement?.retireReason;
    if(!["resolved","superseded"].includes(retireReason)){
      results.push({candidateIndex:i,candidateType:"memory",status:"BLOCKED",targetId,reason:"retireReason 不是 resolved / superseded，停止 RETIRE。"});
      continue;
    }

    const memories=cloud.collection("users").doc(user.uid).collection("memories");
    const oldRef=memories.doc(targetId);

    try{
      const beforeSnap=await oldRef.get();
      if(!beforeSnap.exists) throw new Error("RETIRE targetId 指向的 Memory 不存在。");
      const before=beforeSnap.data();

      // 重送同一則訊息時，若已完成同一退休結果，只驗證，不重複動作。
      if(before.status==="retired"){
        const sameReason=before.retireReason===retireReason;
        const sameSource=Array.isArray(before.sourceMessageIds) && before.sourceMessageIds.includes(messageId);
        if(sameReason && sameSource){
          results.push({candidateIndex:i,candidateType:"memory",status:"VERIFIED_EXISTING",targetId,reason:"同一 RETIRE 已完成；未重複退休，既有結果核對通過。"});
          continue;
        }
        throw new Error("target Memory 已 retired，但不是本次可安全重送的同一結果。");
      }

      if(before.status!=="active") throw new Error("RETIRE target 不是 active Memory，停止執行。");

      if(retireReason==="resolved"){
        if(before.memoryType!=="contextual") throw new Error("resolved 只允許 contextual Memory。");
        if(candidate?.evidenceType!=="explicit") throw new Error("resolved 必須由 explicit 證據支持。");

        const patch={
          status:"retired",
          retireReason:"resolved",
          sourceMessageIds:mergeSourceMessageIds(before.sourceMessageIds,messageId),
          evidenceSummary:String(candidate.evidenceSummary||before.evidenceSummary||""),
          updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
          supersededBy:firebase.firestore.FieldValue.delete()
        };
        await oldRef.update(patch);

        const afterSnap=await oldRef.get();
        if(!afterSnap.exists) throw new Error("resolved RETIRE 後原 Memory 不存在。");
        verifyRetiredMemory(messageId,before,afterSnap.data(),"resolved",null);

        results.push({candidateIndex:i,candidateType:"memory",status:"RETIRED_AND_VERIFIED",targetId,retireReason:"resolved",reason:"contextual Memory 已標記 resolved 並退休，完成寫後讀回核對。"});
        continue;
      }

      // superseded：先建立一張新的 active Memory，再把舊卡退休；兩者使用同一批次提交。
      const newContent=String(replacement?.content ?? candidate?.content ?? "").trim();
      if(!newContent) throw new Error("superseded 缺少新的 Memory content。");

      const newId=`m_${messageId}_${i}_superseding`;
      const newRef=memories.doc(newId);
      const newSnap=await newRef.get();

      if(newSnap.exists){
        const existingNew=newSnap.data();
        if(existingNew.status!=="active" || existingNew.content!==newContent)
          throw new Error("同一 superseded replacement ID 已存在，但內容不一致，停止執行。");
      }

      const newDoc=buildCreateDocument(messageId,candidate,{replacement:{...replacement,content:newContent}});
      const retirePatch={
        status:"retired",
        retireReason:"superseded",
        supersededBy:newId,
        sourceMessageIds:mergeSourceMessageIds(before.sourceMessageIds,messageId),
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      };

      const batch=cloud.batch();
      if(!newSnap.exists) batch.set(newRef,newDoc);
      batch.update(oldRef,retirePatch);
      await batch.commit();

      const [afterOldSnap,afterNewSnap]=await Promise.all([oldRef.get(),newRef.get()]);
      if(!afterOldSnap.exists || !afterNewSnap.exists) throw new Error("superseded RETIRE 後讀回文件不完整。");
      verifyRetiredMemory(messageId,before,afterOldSnap.data(),"superseded",newId);
      verifyCreatedDocument(messageId,candidate,afterNewSnap.data());
      if(afterNewSnap.data().content!==newContent) throw new Error("新的 superseding Memory content 核對失敗。");

      results.push({candidateIndex:i,candidateType:"memory",status:"SUPERSEDED_AND_VERIFIED",targetId,replacementId:newId,retireReason:"superseded",reason:"新 Memory 與舊 Memory 退休已完成，並讀回核對 supersededBy 關係。"});
    }catch(e){
      results.push({candidateIndex:i,candidateType:candidate?.targetType||"",status:"ERROR",targetId:targetId||null,reason:String(e?.message||e)});
    }
  }

  return {messageId,results};
}



function recallSearchText(card){
  if(card?.targetType==="memory"){
    return [card.content,card.category,card.evidenceSummary,card.originalTimeExpression].filter(Boolean).join(" ");
  }
  return [card.title,card.progress,card.evidenceSummary,card.originalTimeExpression].filter(Boolean).join(" ");
}

function chineseBigrams(text){
  const s=String(text||"").toLowerCase().replace(/\s+/g,"");
  const out=new Set();
  for(let i=0;i<s.length-1;i++){
    const pair=s.slice(i,i+2);
    if(/[\u3400-\u9fff]/.test(pair)) out.add(pair);
  }
  return out;
}

function sensitiveLikelyRelevant(message,card){
  const a=chineseBigrams(message);
  const b=chineseBigrams(recallSearchText(card));
  for(const x of a) if(b.has(x)) return true;

  const words=String(message||"").toLowerCase().match(/[a-z0-9]{3,}/g)||[];
  const hay=recallSearchText(card).toLowerCase();
  return words.some(w=>hay.includes(w));
}

function compactRecallCard(id,targetType,data){
  if(targetType==="memory"){
    return {
      id,targetType:"memory",
      content:String(data.content||""),
      category:String(data.category||""),
      memoryType:String(data.memoryType||""),
      status:String(data.status||"active"),
      sensitivity:String(data.sensitivity||"normal"),
      evidenceSummary:String(data.evidenceSummary||""),
      eventTimeValue:data.eventTimeValue??null,
      timeGranularity:data.timeGranularity??null,
      timeCertainty:data.timeCertainty??null,
      originalTimeExpression:data.originalTimeExpression??null
    };
  }
  return {
    id,targetType:"item",
    title:String(data.title||""),
    state:String(data.state||"ongoing"),
    progress:data.progress??null,
    sensitivity:String(data.sensitivity||"normal"),
    evidenceSummary:String(data.evidenceSummary||""),
    eventTimeValue:data.eventTimeValue??null,
    timeGranularity:data.timeGranularity??null,
    timeCertainty:data.timeCertainty??null,
    originalTimeExpression:data.originalTimeExpression??null
  };
}

async function loadRecallPoolReadOnly(currentUserMessage){
  if(!user) return [];
  const base=cloud.collection("users").doc(user.uid);
  const [memorySnap,itemSnap]=await Promise.all([
    base.collection("memories").get(),
    base.collection("items").get()
  ]);

  const cards=[];
  memorySnap.forEach(doc=>{
    const data=doc.data()||{};
    const card=compactRecallCard(doc.id,"memory",data);
    if(card.sensitivity!=="sensitive" || sensitiveLikelyRelevant(currentUserMessage,card)) cards.push(card);
  });
  itemSnap.forEach(doc=>{
    const data=doc.data()||{};
    const card=compactRecallCard(doc.id,"item",data);
    if(card.sensitivity!=="sensitive" || sensitiveLikelyRelevant(currentUserMessage,card)) cards.push(card);
  });
  return cards;
}

async function runRecallReadOnly(currentUserMessage,idToken){
  const cards=await loadRecallPoolReadOnly(currentUserMessage);
  if(!cards.length){
    return {query:currentUserMessage,poolCount:0,selectedCards:[],recall:{shouldRecall:false,selectedIds:[],reason:"目前沒有可供 Recall 判斷的卡片。"}};
  }

  const r=await fetch(BUTLER_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+idToken
    },
    body:JSON.stringify({mode:"recall",currentUserMessage,cards})
  });
  const data=await r.json();
  if(!r.ok || !data.ok) throw new Error(data?.error || ("Recall HTTP "+r.status));

  const selectedIds=Array.isArray(data?.recall?.selectedIds)?data.recall.selectedIds:[];
  const byId=new Map(cards.map(x=>[x.id,x]));
  const selectedCards=selectedIds.map(id=>byId.get(id)).filter(Boolean);

  return {
    query:currentUserMessage,
    poolCount:cards.length,
    selectedCards,
    recall:data.recall
  };
}

async function deleteMemoryTest(){
 const el=document.getElementById('memoryReadStatus'),btn=document.getElementById('memoryDeleteBtn');
 if(!el||!btn)return;
 if(!user){el.textContent='❌ 請先登入 Google 帳號。';return}
 if(!confirm('確定刪除這張「綠色杯子」測試記憶？只會刪除 testOnly=true 且內容完全相符的測試資料。'))return;
 btn.disabled=true;el.textContent='正在刪除測試記憶……';
 try{
  const snap=await cloud.collection('users').doc(user.uid).collection('memories').where('testOnly','==',true).get();
  const matches=snap.docs.filter(d=>d.data().content==='姐姐測試用最喜歡綠色杯子');
  if(matches.length!==1)throw new Error(`預期找到 1 張綠色杯子測試記憶，實際找到 ${matches.length} 張；為避免刪錯資料，已停止。`);
  await matches[0].ref.delete();
  const verify=await cloud.collection('users').doc(user.uid).collection('memories').doc(matches[0].id).get();
  if(verify.exists)throw new Error('刪除後重新查核時，文件仍存在；已停止後續動作。');
  el.textContent='✅ 已刪除並重新查核：原文件已不存在。';
  await readMemories();
 }catch(e){el.textContent='❌ 刪除失敗：'+e.message}
 finally{btn.disabled=false}
}

async function syncNow(){if(!user||syncing)return;syncing=true;setStatus('↻ 同步中');try{
 await openDB();
 let local=await allMessages();
 // 先為舊 V0.1 訊息補 cloudId，再上傳。setDoc 可重複執行而不產生重複資料。
 for(const m of local){if(!m.cloudId){m.cloudId=makeCloudId();await putMessage(m)};await cloud.collection('users').doc(user.uid).collection('messages').doc(m.cloudId).set({role:m.role||'user',text:m.text||'',createdAt:m.createdAt||Date.now()},{merge:true});if(!m.synced){m.synced=true;await putMessage(m)}}
 const snap=await cloud.collection('users').doc(user.uid).collection('messages').orderBy('createdAt','asc').get();
 local=await allMessages();const ids=new Set(local.map(x=>x.cloudId).filter(Boolean));
 for(const d of snap.docs){if(ids.has(d.id))continue;const x=d.data();await addMessage({cloudId:d.id,role:x.role||'user',text:x.text||'',createdAt:x.createdAt||Date.now(),synced:true})}
 setStatus('● 已同步');if(tab==='chat')await renderChat();if(tab==='me')renderMe();
 }catch(e){setStatus('● 本機');alert('同步沒有完成：'+e.message)}finally{syncing=false}}

function showThinking(){
  removeThinking();
  const m=document.querySelector('#main');
  if(!m)return;
  const el=document.createElement('div');
  el.id='thinkingBubble';
  el.className='bubble xiaole thinking';
  el.innerHTML='小樂正在想<span class="thinkingDots" id="thinkingDots">.</span>';
  m.appendChild(el);
  let n=1;
  window.xiaoleThinkingTimer=setInterval(()=>{
    const d=document.getElementById('thinkingDots');
    if(!d)return;
    n=n%3+1;
    d.textContent='.'.repeat(n);
  },450);
  scrollTo(0,document.body.scrollHeight);
}
function removeThinking(){
  if(window.xiaoleThinkingTimer){clearInterval(window.xiaoleThinkingTimer);window.xiaoleThinkingTimer=null;}
  document.getElementById('thinkingBubble')?.remove();
}
async function sendMsg(){
  let v=input.value.trim();
  if(!v)return;

  const userMessage={role:'user',text:v,createdAt:Date.now(),cloudId:makeCloudId(),synced:false};
  await addMessage(userMessage);
  input.value='';
  send.disabled=true;
  input.disabled=true;
  await renderChat();
  showThinking();
  if(user)syncNow();

  try{
    // 只帶最近 8 則對話（包含剛送出的這一句），讓小樂接得住眼前上下文。
    const recent=(await allMessages())
      .filter(x=>x.role==='user'||x.role==='assistant')
      .sort((a,b)=>a.createdAt-b.createdAt)
      .slice(-8)
      .map(x=>({role:x.role,text:String(x.text||'')}));

    // V0.6.2：Firebase ID token 作為敲管家門的短效門禁卡。
    if(!user) throw new Error('請先登入 Google 帳號，才能和小樂聊天。');
    const idToken=await user.getIdToken();

    // V0.7 Recall → Answer：先唯讀找出真正相關的既有卡片，再把「選中的卡片」交給正常回答。
    // Recall 本身仍不寫入 Memory / Item。
    let recallResult;
    try{
      recallResult=await runRecallReadOnly(v,idToken);
      lastRecallObservation={messageId:userMessage.cloudId,...recallResult};
    }catch(recallError){
      recallResult={
        poolCount:0,
        selectedCards:[],
        recall:{shouldRecall:false,selectedIds:[],reason:"❌ Recall 發生錯誤："+String(recallError?.message||recallError)}
      };
      lastRecallObservation={messageId:userMessage.cloudId,...recallResult};
    }
    const recalledCards=Array.isArray(recallResult?.selectedCards)?recallResult.selectedCards:[];

    const r=await fetch(BUTLER_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+idToken
      },
      body:JSON.stringify({message:v,messageId:userMessage.cloudId,messageCreatedAt:userMessage.createdAt,messageTimezoneOffsetMinutes:new Date(userMessage.createdAt).getTimezoneOffset(),recent,recalledCards})
    });
    const data=await r.json();
    if(!r.ok || !data.ok) throw new Error(data?.error || ('HTTP '+r.status));

    // V0.7 messageId 完整性檢查：Worker 回傳的編號必須與這則原始訊息的 cloudId 完全一致。
    if(data.receivedMessageId !== userMessage.cloudId){
      throw new Error('messageId 核對失敗：Worker 收到的編號與原始訊息 cloudId 不一致。');
    }
    if(data.receivedMessageCreatedAt !== userMessage.createdAt){
      throw new Error('messageCreatedAt 核對失敗：Worker 收到的時間與原始訊息 createdAt 不一致。');
    }
    const expectedTimezoneOffsetMinutes=new Date(userMessage.createdAt).getTimezoneOffset();
    if(data.receivedMessageTimezoneOffsetMinutes !== expectedTimezoneOffsetMinutes){
      throw new Error('messageTimezoneOffsetMinutes 核對失敗：Worker 收到的時區偏移與原始訊息不一致。');
    }

    lastCandidateObservation={
      messageId:userMessage.cloudId,
      candidates:Array.isArray(data.candidates)?data.candidates:[]
    };
    lastRelatedCardsObservation={
      messageId:userMessage.cloudId,
      groups:await loadRelatedCardsReadOnly(lastCandidateObservation.candidates)
    };
    lastJudgeObservation=await buildJudgeObservation(
      userMessage.cloudId,
      lastCandidateObservation.candidates,
      lastRelatedCardsObservation.groups
    );
    lastValidationObservation=buildValidationObservation(
      userMessage.cloudId,
      lastCandidateObservation.candidates,
      lastRelatedCardsObservation.groups,
      lastJudgeObservation
    );
    lastWriteObservation=await executeCreateWrites(
      userMessage.cloudId,
      lastCandidateObservation.candidates,
      lastJudgeObservation,
      lastValidationObservation
    );
    lastUpdateObservation=await executeUpdateWrites(
      userMessage.cloudId,
      lastCandidateObservation.candidates,
      lastRelatedCardsObservation,
      lastJudgeObservation,
      lastValidationObservation
    );
    lastRetireObservation=await executeRetireWrites(
      userMessage.cloudId,
      lastCandidateObservation.candidates,
      lastRelatedCardsObservation,
      lastJudgeObservation,
      lastValidationObservation
    );

    const reply=String(data.reply||'').trim();
    if(!reply) throw new Error('小樂有收到訊息，但沒有取得回答文字。');

    const aiMessage={role:'assistant',text:reply,createdAt:Date.now(),cloudId:makeCloudId(),synced:false};
    await addMessage(aiMessage);
    removeThinking();
    await renderChat();
    if(user)syncNow();
  }catch(e){
    removeThinking();
    const errorMessage={role:'assistant',text:'目前沒有順利收到小樂的回答。\n'+e.message,createdAt:Date.now(),cloudId:makeCloudId(),synced:false};
    await addMessage(errorMessage);
    await renderChat();
  }finally{
    send.disabled=false;
    input.disabled=false;
    input.focus();
  }
}
